services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_post
      POSTGRES_PASSWORD: happy_post_local
      POSTGRES_USER: happy_post
    ports:
      - "127.0.0.1:${HAPPY_POST_DB_HOST_PORT:-5432}:5432"
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U happy_post -d happy_post"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - happy-post-db:/var/lib/postgresql/data

  backend-migrate:
    image: happy-post-backend:local
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_TIMEZONE: Australia/Melbourne
      DATABASE_URL: postgresql+psycopg://happy_post:happy_post_local@db:5432/happy_post
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: happy-post-backend:local
    build: ./backend
    environment:
      APP_TIMEZONE: Australia/Melbourne
      DATABASE_URL: postgresql+psycopg://happy_post:happy_post_local@db:5432/happy_post
    ports:
      - "127.0.0.1:${HAPPY_POST_BACKEND_HOST_PORT:-8000}:8000"
    restart: "no"
    init: true
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    image: happy-post-frontend:local
    build:
      context: ./frontend
      args:
        BACKEND_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: "no"
    init: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  happy-post-db:
