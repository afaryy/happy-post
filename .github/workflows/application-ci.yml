name: Application CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read

jobs:
  detect-components:
    name: Detect affected application components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Check out pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Select affected components
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          test_all=false
          if grep -Eq '^(compose\.yaml|\.github/workflows/application-ci\.yml)$' <<< "$changed_files"; then
            test_all=true
          fi

          backend=false
          frontend=false
          if [[ "$test_all" == true ]] || grep -Eq '^backend/' <<< "$changed_files"; then
            backend=true
          fi
          if [[ "$test_all" == true ]] || grep -Eq '^frontend/' <<< "$changed_files"; then
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Selected components: backend=$backend frontend=$frontend"

  test-backend:
    name: Test backend
    needs: detect-components
    if: needs.detect-components.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        run: uv sync --locked --group dev
        working-directory: backend

      - name: Run backend lint
        run: uv run --group dev ruff check .
        working-directory: backend

      - name: Run backend unit tests
        run: uv run --group dev pytest
        working-directory: backend

  test-frontend:
    name: Test frontend
    needs: detect-components
    if: needs.detect-components.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Run frontend unit tests
        run: npm run test:run
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
