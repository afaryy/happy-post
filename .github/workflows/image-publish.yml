name: Publish Immutable Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish from main; use all for the initial publication.
        required: true
        type: choice
        options:
          - backend
          - frontend
          - all

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "893794041695"
  ECR_PUBLISH_ROLE_ARN: arn:aws:iam::893794041695:role/happy-post-sandbox-ecr-publish

jobs:
  detect-components:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select changed components
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_COMPONENT: ${{ inputs.component || '' }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          backend=false
          frontend=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              case "$REQUESTED_COMPONENT" in
                backend) backend=true ;;
                frontend) frontend=true ;;
                all) backend=true; frontend=true ;;
                *) echo "Unsupported component: $REQUESTED_COMPONENT"; exit 1 ;;
              esac
              ;;
            push)
              if [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
                changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
              else
                changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
              fi
              if grep -Eq '^backend/' <<< "$changed_files"; then
                backend=true
              fi
              if grep -Eq '^frontend/' <<< "$changed_files"; then
                frontend=true
              fi
              ;;
            *) echo "Unsupported event: $EVENT_NAME"; exit 1 ;;
          esac

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Selected components: backend=$backend frontend=$frontend"

  publish-backend:
    name: Build, scan, and publish backend
    needs: detect-components
    if: needs.detect-components.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Build backend image locally
        env:
          LOCAL_IMAGE: happy-post-backend:${{ github.sha }}
        run: docker build --pull --file backend/Dockerfile --tag "$LOCAL_IMAGE" backend

      - name: Block HIGH and CRITICAL backend image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: happy-post-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ECR_PUBLISH_ROLE_ARN }}
          role-session-name: happy-post-image-publish-${{ github.run_id }}

      - name: Push backend image to its ECR repository
        id: publish
        env:
          REPOSITORY: happy-post-sandbox-backend
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          destination="$registry/$REPOSITORY:$IMAGE_TAG"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag "happy-post-backend:${GITHUB_SHA}" "$destination"
          docker push "$destination"
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record backend digest handoff
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "component=backend"
            echo "repository=happy-post-sandbox-backend"
            echo "digest=$DIGEST"
            echo "source_commit=$GITHUB_SHA"
          } > image-digest.txt

      - name: Upload backend digest handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-image-digest-${{ github.sha }}
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 7

  publish-frontend:
    name: Build, scan, and publish frontend
    needs: detect-components
    if: needs.detect-components.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Build frontend image locally
        env:
          LOCAL_IMAGE: happy-post-frontend:${{ github.sha }}
        run: docker build --pull --file frontend/Dockerfile --tag "$LOCAL_IMAGE" frontend

      - name: Block HIGH and CRITICAL frontend image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: happy-post-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ECR_PUBLISH_ROLE_ARN }}
          role-session-name: happy-post-image-publish-${{ github.run_id }}

      - name: Push frontend image to its ECR repository
        id: publish
        env:
          REPOSITORY: happy-post-sandbox-frontend
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          destination="$registry/$REPOSITORY:$IMAGE_TAG"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag "happy-post-frontend:${GITHUB_SHA}" "$destination"
          docker push "$destination"
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record frontend digest handoff
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "component=frontend"
            echo "repository=happy-post-sandbox-frontend"
            echo "digest=$DIGEST"
            echo "source_commit=$GITHUB_SHA"
          } > image-digest.txt

      - name: Upload frontend digest handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-image-digest-${{ github.sha }}
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 7
