name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Terraform root to destroy. The selected root must exist in the selected commit.
        required: true
        type: choice
        options:
          - network
          - security-identity
          - platform
          - edge
          - data
          - backend-service
          - frontend-service
          - observability
      confirm:
        description: Enter destroy-<target> to destroy the selected root from a fresh destroy plan.
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TF_IN_AUTOMATION: "true"
  TERRAFORM_APPLY_ROLE_ARN: arn:aws:iam::893794041695:role/happy-post-sandbox-terraform-apply

jobs:
  destroy-selected-target:
    name: Destroy selected Terraform root
    runs-on: ubuntu-latest
    environment: sandbox
    concurrency:
      group: terraform-${{ inputs.target }}-state
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          TERRAFORM_TARGET: ${{ inputs.target }}
        run: |
          test "$CONFIRM" = "destroy-$TERRAFORM_TARGET"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve immutable main commit
        id: commit
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit_sha="$(git rev-parse origin/main)"
          git checkout --detach "$commit_sha"
          test "$(git rev-parse HEAD)" = "$commit_sha"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Destroying from immutable main commit: $commit_sha"

      - name: Confirm immutable checkout
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main

      - name: Resolve selected Terraform root
        id: target
        env:
          TERRAFORM_TARGET: ${{ inputs.target }}
        run: |
          case "$TERRAFORM_TARGET" in
            network) working_directory=infra/terraform/foundations/network ;;
            security-identity) working_directory=infra/terraform/foundations/security-identity ;;
            platform) working_directory=infra/terraform/foundations/platform ;;
            edge) working_directory=infra/terraform/foundations/edge ;;
            data) working_directory=infra/terraform/stacks/data ;;
            backend-service) working_directory=infra/terraform/stacks/backend-service ;;
            frontend-service) working_directory=infra/terraform/stacks/frontend-service ;;
            observability) working_directory=infra/terraform/stacks/observability ;;
            *) echo "Unsupported Terraform target: $TERRAFORM_TARGET"; exit 1 ;;
          esac
          test -d "$working_directory"
          echo "working_directory=$working_directory" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: happy-post-terraform-destroy-${{ github.run_id }}

      - name: Initialise remote state
        run: terraform -chdir="${{ steps.target.outputs.working_directory }}" init -input=false

      - name: Create fresh destroy plan
        run: terraform -chdir="${{ steps.target.outputs.working_directory }}" plan -destroy -input=false -lock-timeout=5m -out=tfplan-destroy

      - name: Apply exact destroy plan
        run: terraform -chdir="${{ steps.target.outputs.working_directory }}" apply -input=false tfplan-destroy
